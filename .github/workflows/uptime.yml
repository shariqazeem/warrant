# Is warrant.world answering? Every 15 minutes, from outside the server it runs on.
# A failed run notifies the repository owner through GitHub, so an outage reaches the
# founder even when nobody is looking at the site.
name: uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: The front page answers
        run: curl -fsS --max-time 30 -o /dev/null -w "%{http_code} in %{time_total}s\n" https://warrant.world/
      - name: The grants page answers
        run: curl -fsS --max-time 30 -o /dev/null -w "%{http_code} in %{time_total}s\n" https://warrant.world/grants
